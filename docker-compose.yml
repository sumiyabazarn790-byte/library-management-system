services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SUPABASE_PROJECT_ID: ${NEXT_PUBLIC_SUPABASE_PROJECT_ID:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENABLE_SALE_LISTINGS: ${NEXT_PUBLIC_ENABLE_SALE_LISTINGS:-false}
        NEXT_PUBLIC_GOOGLE_SEARCH_API_KEY: ${NEXT_PUBLIC_GOOGLE_SEARCH_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE_ID: ${NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE_ID:-}
        NEXT_PUBLIC_QPAY_MERCHANT_NAME: ${NEXT_PUBLIC_QPAY_MERCHANT_NAME:-Aetheria Library}
        NEXT_PUBLIC_QPAY_NOTE: ${NEXT_PUBLIC_QPAY_NOTE:-Book borrow payment}
        NEXT_PUBLIC_QPAY_DEEP_LINK: ${NEXT_PUBLIC_QPAY_DEEP_LINK:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SUPABASE_PROJECT_ID: ${NEXT_PUBLIC_SUPABASE_PROJECT_ID:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ENABLE_SALE_LISTINGS: ${NEXT_PUBLIC_ENABLE_SALE_LISTINGS:-false}
      NEXT_PUBLIC_GOOGLE_SEARCH_API_KEY: ${NEXT_PUBLIC_GOOGLE_SEARCH_API_KEY:-}
      NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE_ID: ${NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE_ID:-}
      NEXT_PUBLIC_QPAY_MERCHANT_NAME: ${NEXT_PUBLIC_QPAY_MERCHANT_NAME:-Aetheria Library}
      NEXT_PUBLIC_QPAY_NOTE: ${NEXT_PUBLIC_QPAY_NOTE:-Book borrow payment}
      NEXT_PUBLIC_QPAY_DEEP_LINK: ${NEXT_PUBLIC_QPAY_DEEP_LINK:-}
    ports:
      - "3000:3000"
